# Generates one Application per directory matching apps/projects/*/* — adding an app is just adding a
# directory of manifests; there is no list to update.
#
# Layout is apps/projects/<namespace>/<app>/ — the namespace is taken from the path, since these
# apps are spread across rebnz, russell and default.
# Safety:
#   applicationsSync: create-update  — removing (or renaming/typo-ing) a directory never deletes
#                                      the Application, so it can't cascade-delete a workload.
#   preserveResourcesOnDeletion      — if the ApplicationSet itself is deleted, the generated
#                                      Applications go but the workloads they manage stay.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: projects
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/LaSpruca/argo-apps.git
        revision: main
        directories:
          - path: apps/projects/*/*
  syncPolicy:
    applicationsSync: create-update
    preserveResourcesOnDeletion: true
  template:
    metadata:
      name: '{{ .path.basename }}'
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: projects
      source:
        repoURL: https://github.com/LaSpruca/argo-apps.git
        targetRevision: main
        path: '{{ .path.path }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ index .path.segments 2 }}'
      syncPolicy:
        # Auto-sync is deliberately off until each app's first diff has been reviewed.
        # See README.md "Adopting the live cluster" before enabling it.
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
