# Shared cluster resources that no single app owns: namespaces, the ACME ClusterIssuer, the
# pre-provisioned media PVCs, the ingress-nginx LoadBalancer Service.
#
# Directory sources are non-recursive by default, which keeps static/manifests/reference/
# (verbatim cluster dumps, kept for diffing only) out of the sync. Don't set
# `directory: {recurse: false}` explicitly: Argo strips the all-default block from the live
# Application, so `root` would report it OutOfSync forever.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: static
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infra
  source:
    repoURL: https://github.com/LaSpruca/argo-apps.git
    targetRevision: main
    path: static/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    # Off until reviewed — these PVCs are bound to 80Ti/24Ti of real data.
    syncOptions:
      - ServerSideApply=true
