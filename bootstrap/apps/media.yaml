# Group root for apps/media. Syncs only the Application manifests sitting directly in that
# directory (recurse=false) — the per-app manifest subdirectories are owned by those Applications.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: media-apps
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: bootstrap
  source:
    repoURL: https://github.com/LaSpruca/argo-apps.git
    targetRevision: main
    path: apps/media
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
