apiVersion: v1
kind: ServiceAccount
metadata:
  name: tdarr-scaler
  namespace: media
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tdarr-scaler
  namespace: media
rules:
- apiGroups:
  - apps
  resourceNames:
  - tdarr-node
  resources:
  - statefulsets/scale
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - apps
  resourceNames:
  - tdarr-node
  resources:
  - statefulsets
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tdarr-scaler
  namespace: media
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tdarr-scaler
subjects:
- kind: ServiceAccount
  name: tdarr-scaler
  namespace: media
