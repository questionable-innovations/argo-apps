apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prowlarr
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: media
  source:
    repoURL: https://github.com/LaSpruca/argo-apps.git
    targetRevision: main
    path: apps/media/prowlarr
  destination:
    server: https://kubernetes.default.svc
    namespace: media
  syncPolicy:
    # Auto-sync is deliberately off until each app's first diff has been reviewed.
    # See README.md "Adopting the live cluster" before enabling it.
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
