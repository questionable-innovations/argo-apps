apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    keel.sh/policy: force
    keel.sh/pollSchedule: '@every 1m'
    keel.sh/secrets: ghcr-russell
    keel.sh/trigger: poll
    kubernetes.io/change-cause: keel automated update, version latest -> master [2026-01-25T02:53:34Z]
  name: falderia
  namespace: russell
spec:
  replicas: 1
  selector:
    matchLabels:
      app: falderia
  template:
    metadata:
      annotations:
        keel.sh/update-time: 2026-01-25 02:53:34.595584618 +0000 UTC m=+50.221048051
      labels:
        app: falderia
    spec:
      containers:
      - image: ghcr.io/russellbloxwich/falderia:master
        imagePullPolicy: Always
        name: falderia
        ports:
        - containerPort: 8080
          name: http
      imagePullSecrets:
      - name: ghcr-russell
      serviceAccountName: russell
---
apiVersion: v1
kind: Service
metadata:
  name: falderia
  namespace: russell
spec:
  ports:
  - port: 80
    targetPort: 8080
  selector:
    app: falderia
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
  name: falderia
  namespace: russell
spec:
  ingressClassName: nginx
  rules:
  - host: falderia.bloflix.com
    http:
      paths:
      - backend:
          service:
            name: falderia
            port:
              number: 80
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - falderia.bloflix.com
    secretName: falderia-tls
