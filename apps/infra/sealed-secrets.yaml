apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infra
  sources:
    # The upstream chart, pinned. Values are read from this repo via the `values` ref below,
    # so the chart is never forked or vendored.
    - repoURL: https://bitnami.github.io/sealed-secrets
      chart: sealed-secrets
      targetRevision: "2.22.0"
      helm:
        valueFiles:
          - $values/apps/infra/sealed-secrets/values.yaml
    - repoURL: https://github.com/LaSpruca/argo-apps.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    # kube-system, not a namespace of its own: see the values file.
    namespace: kube-system
  syncPolicy:
    # Auto-sync is deliberately off until each app's first diff has been reviewed.
    # See README.md "Adopting the live cluster" before enabling it.
    syncOptions:
      - ServerSideApply=true
