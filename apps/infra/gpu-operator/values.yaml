# NVIDIA GPU Operator — chart https://helm.ngc.nvidia.com/nvidia, pinned to the live release (v25.3.4).
# Matches `helm get values gpu-operator-1722298273 -n gpu-operator`, plus the `validator.plugin`
# override below.
#
# NOTE: the Application sets `helm.releaseName: gpu-operator-1722298273` to preserve the
# generated names of the node-feature-discovery sub-chart resources already in the cluster.
driver:
  enabled: true

# CDI mode for every GPU container, in place of the legacy nvidia-container-runtime-hook.
# The legacy hook cannot start a privileged container on quentin.lan (Rocky 10): the kernel
# rejects the device-filter eBPF program it loads, so the operator validator never passes and
# the node never advertises nvidia.com/gpu. To go back, set both to false and restart the GPU
# pods (plex, tdarr-node).
cdi:
  enabled: true
  default: true

toolkit:
  enabled: true
  env:
    # k3s-specific containerd paths — this is what registers the `nvidia` RuntimeClass.
    - name: CONTAINERD_CONFIG
      value: /var/lib/rancher/k3s/agent/etc/containerd/config.toml
    - name: CONTAINERD_SOCKET
      value: /run/k3s/containerd/containerd.sock
    - name: CONTAINERD_RUNTIME_CLASS
      value: nvidia
    - name: CONTAINERD_SET_AS_DEFAULT
      value: "true"

devicePlugin:
  # GPU time-slicing. The ConfigMap lives in manifests/ next to this file and is synced by the
  # same Application. Removing this drops every GPU consumer back to a single exclusive slot.
  config:
    name: nvidia-device-plugin-config
    default: any
  env:
    - name: PASS_DEVICE_SPECS
      value: "true"
    - name: FAIL_ON_INIT_ERROR
      value: "true"
    # Values set here override what the operator sets, so this has to name the CDI strategy
    # itself. Plain `envvar` would leave the plugin handing out legacy device lists.
    - name: DEVICE_LIST_STRATEGY
      value: envvar,cdi-annotations
    - name: DEVICE_ID_STRATEGY
      value: uuid
    - name: NVIDIA_VISIBLE_DEVICES
      value: all
    - name: NVIDIA_DRIVER_CAPABILITIES
      value: compute,compat32,graphics,utility,video

validator:
  # The chart defaults `validator.plugin.env: []`, which renders as `plugin: null` in the
  # ClusterPolicy. Helm's client-side apply tolerates that; server-side apply rejects it
  # ("spec.validator.plugin must be of type object"). Nulling the key skips the block entirely,
  # which is also what the live ClusterPolicy has.
  plugin: null
  driver:
    env:
      - name: DISABLE_DEV_CHAR_SYMLINK_CREATION
        value: "true"
