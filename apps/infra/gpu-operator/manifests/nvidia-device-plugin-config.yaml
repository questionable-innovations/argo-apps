# GPU time-slicing config, referenced by `devicePlugin.config` in ../values.yaml.
# Advertises the single physical GPU as 4 `nvidia.com/gpu` slots.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nvidia-device-plugin-config
  namespace: gpu-operator
data:
  any: |-
    version: v1
    flags:
      migStrategy: none
    sharing:
      timeSlicing:
        renameByDefault: false
        failRequestsGreaterThanOne: false
        resources:
          - name: nvidia.com/gpu
            replicas: 4
