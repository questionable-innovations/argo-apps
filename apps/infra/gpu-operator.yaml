apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gpu-operator
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infra
  sources:
    # The upstream chart, pinned. Values are read from this repo via the `values` ref below,
    # so the chart is never forked or vendored.
    - repoURL: https://helm.ngc.nvidia.com/nvidia
      chart: gpu-operator
      targetRevision: "v25.3.4"
      helm:
        releaseName: gpu-operator-1722298273
        valueFiles:
          - $values/apps/infra/gpu-operator/values.yaml
    - repoURL: https://github.com/LaSpruca/argo-apps.git
      targetRevision: main
      ref: values
    # Plain manifests that belong with the operator but aren't part of the chart
    # (the time-slicing ConfigMap).
    - repoURL: https://github.com/LaSpruca/argo-apps.git
      targetRevision: main
      path: apps/infra/gpu-operator/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: gpu-operator
  syncPolicy:
    # Auto-sync is deliberately off until each app's first diff has been reviewed.
    # See README.md "Adopting the live cluster" before enabling it.
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
