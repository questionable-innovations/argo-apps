apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infra
  sources:
    # The upstream chart, pinned. Values are read from this repo via the `values` ref below,
    # so the chart is never forked or vendored.
    - repoURL: https://kubernetes.github.io/ingress-nginx
      chart: ingress-nginx
      targetRevision: "4.6.0"
      helm:
        valueFiles:
          - $values/apps/infra/ingress-nginx/values.yaml
    - repoURL: https://github.com/LaSpruca/argo-apps.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx
  syncPolicy:
    # Auto-sync is deliberately off until each app's first diff has been reviewed.
    # See README.md "Adopting the live cluster" before enabling it.
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
