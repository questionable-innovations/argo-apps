# Sealed with kubeseal against the martin cluster; only its controller can decrypt these.
# Bound to their name and the nextcloud namespace. To rotate one, re-seal it the same way
# (see README "Sealed Secrets") and replace its block here.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: nextcloud-admin
  namespace: nextcloud
spec:
  encryptedData:
    nextcloud-password: 
    nextcloud-username: 
  template:
    metadata:
      name: nextcloud-admin
      namespace: nextcloud
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: nextcloud-db
  namespace: nextcloud
spec:
  encryptedData:
    db-password: 
    db-username: 
  template:
    metadata:
      name: nextcloud-db
      namespace: nextcloud
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: nextcloud-redis
  namespace: nextcloud
spec:
  encryptedData:
    redis-password: 
  template:
    metadata:
      name: nextcloud-redis
      namespace: nextcloud
