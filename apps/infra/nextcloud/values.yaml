# nextcloud — chart https://nextcloud.github.io/helm/, pinned to 9.4.5 (Nextcloud 35.0.3,
# apache image). Served at https://next.qinnovate.nz.
#
# The chart owns only the Nextcloud Deployment, Service and Ingress. The PVCs, credentials and
# database live in apps/infra/nextcloud/manifests/ so that no chart change or `helm uninstall`
# can take the data with it.
nextcloud:
  host: next.qinnovate.nz

  # Admin login, from the `nextcloud-admin` SealedSecret. Only read on first install; after
  # that the admin password lives in Nextcloud's database and is changed in the UI.
  existingSecret:
    enabled: true
    secretName: nextcloud-admin
    usernameKey: nextcloud-username
    passwordKey: nextcloud-password

  extraEnv:
    # Traefik terminates TLS and forwards plain HTTP from a pod IP. Trust the k3s pod network
    # as a proxy so Nextcloud reads the real client address from X-Forwarded-For (brute-force
    # throttling keys on it) instead of throttling Traefik itself.
    - name: TRUSTED_PROXIES
      value: 10.42.0.0/16
    # Needed for `occ` and background jobs, which have no request to take the URL from.
    - name: OVERWRITECLIURL
      value: https://next.qinnovate.nz
    # Outbound mail through Mailgun (domain mg.qinnovate.nz, US region). Set as plain env vars
    # read by the image's smtp.config.php rather than through the chart's `nextcloud.mail`
    # block, because that block insists the SMTP keys live in the admin-credentials Secret.
    # The credential is a Mailgun SMTP login used only by Nextcloud; revoking it there is safe.
    - name: MAIL_FROM_ADDRESS
      value: nextcloud
    - name: MAIL_DOMAIN
      value: mg.qinnovate.nz
    - name: SMTP_SECURE
      value: ssl
    - name: SMTP_PORT
      value: "465"
    - name: SMTP_AUTHTYPE
      value: LOGIN
    - name: SMTP_HOST
      valueFrom:
        secretKeyRef:
          name: nextcloud-smtp
          key: smtp-host
    - name: SMTP_NAME
      valueFrom:
        secretKeyRef:
          name: nextcloud-smtp
          key: smtp-username
    - name: SMTP_PASSWORD
      valueFrom:
        secretKeyRef:
          name: nextcloud-smtp
          key: smtp-password

  # HSTS header; see manifests/apache-hsts.yaml. A ConfigMap mounted by subPath is not updated
  # in a running pod, so restart the Deployment after changing it.
  extraVolumes:
    - name: apache-hsts
      configMap:
        name: nextcloud-apache-hsts
  extraVolumeMounts:
    - name: apache-hsts
      mountPath: /etc/apache2/conf-enabled/hsts.conf
      subPath: hsts.conf
      readOnly: true

  configs:
    region.config.php: |-
      <?php
      $CONFIG = array (
        'default_phone_region' => 'NZ',
        // Run the heavy daily background jobs overnight NZ time (value is the start hour, UTC).
        'maintenance_window_start' => 13,
      );

# Generate https:// links even though the pod itself only ever sees plain HTTP from Traefik.
phpClientHttpsFix:
  enabled: true
  protocol: https

# SQLite (the chart default) must not be used: its file would sit on NFS, where its locking is
# unsafe. PostgreSQL runs next to Nextcloud from manifests/postgres.yaml.
internalDatabase:
  enabled: false

externalDatabase:
  enabled: true
  type: postgresql
  host: nextcloud-postgres:5432
  database: nextcloud
  existingSecret:
    enabled: true
    secretName: nextcloud-db
    usernameKey: db-username
    passwordKey: db-password

# Redis (manifests/redis.yaml) for file locking, the distributed cache and PHP sessions. Without
# it Nextcloud takes file locks in PostgreSQL, which is slow under sync-client load.
externalRedis:
  enabled: true
  host: nextcloud-redis
  port: "6379"
  existingSecret:
    enabled: true
    secretName: nextcloud-redis
    passwordKey: redis-password

persistence:
  # /var/www/html: Nextcloud's code, config and installed apps. Small, on app-data.
  enabled: true
  existingClaim: nextcloud-app
  # /var/www/html/data: the users' files. The big one, on the bulk-storage pool.
  nextcloudData:
    enabled: true
    existingClaim: nextcloud-data

# Collabora Online (CODE), the document server behind the "Nextcloud Office" app. It is the
# chart's own `collabora-online` subchart, served on its own hostname because browsers open a
# websocket straight to it. Nextcloud itself talks to it over the in-cluster Service; that URL
# and the public one are set with occ (see README "Nextcloud Office").
collabora:
  enabled: true
  collabora:
    # The only host allowed to open documents here.
    aliasgroups:
      - host: "https://next.qinnovate.nz:443"
    # TLS ends at Traefik (and Cloudflare in front of it), so Collabora speaks plain HTTP but
    # must still hand out https:// and wss:// URLs.
    extra_params: --o:ssl.enable=false --o:ssl.termination=true
    server_name: office.qinnovate.nz
    # Login for the admin console at /browser/dist/admin/admin.html.
    existingSecret:
      enabled: true
      secretName: nextcloud-collabora
      usernameKey: username
      passwordKey: password
  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/ssl-redirect: 'true'
      nginx.ingress.kubernetes.io/proxy-body-size: '0'
      # Editing sessions are long-lived websockets.
      nginx.ingress.kubernetes.io/proxy-read-timeout: '3600'
      nginx.ingress.kubernetes.io/proxy-send-timeout: '3600'
    hosts:
      - host: office.qinnovate.nz
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: collabora-tls
        hosts:
          - office.qinnovate.nz
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 2Gi

# Background jobs via a crond sidecar, rather than the default of piggybacking on page loads.
cronjob:
  enabled: true

ingress:
  enabled: true
  # `nginx` is the class every Ingress in this repo uses; Traefik serves it (see traefik values).
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    # No request body limit. The default is 1m, which breaks every upload.
    nginx.ingress.kubernetes.io/proxy-body-size: '0'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '3600'
    nginx.ingress.kubernetes.io/proxy-send-timeout: '3600'
  tls:
    - secretName: nextcloud-tls
      hosts:
        - next.qinnovate.nz

# The first start copies the whole of Nextcloud onto the NFS volume and runs the installer,
# which takes minutes. Without a startup probe the liveness probe kills the pod mid-install.
# Allow up to 30 minutes.
startupProbe:
  enabled: true
  periodSeconds: 10
  failureThreshold: 180

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    memory: 2Gi
