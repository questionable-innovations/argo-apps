# ingress-nginx — chart https://kubernetes.github.io/ingress-nginx.
#
# STANDBY: Traefik (apps/infra/traefik) now takes the traffic. This controller is retired
# upstream and unpatched for CVE-2026-123007 / CVE-2026-123633; it is kept running, off the
# LoadBalancer, only as a fallback until Traefik has proven itself. Remove it after that, but
# keep the `nginx` IngressClass object, which Traefik's ingress-nginx provider relies on.
#
# Chart 4.6.0 ships controller v1.7.0, i.e. exactly the version already running, so adopting
# this chart does not change the controller image.
#
# MIGRATION NOTE: the live install was applied from the upstream static `deploy.yaml`, not Helm.
# The controller Deployment/Service/ConfigMap and the `ingress-nginx` release labels already
# match what this chart renders. Notes:
#   1. No TCP passthrough. The live install had a `tcp-services` ConfigMap mapping 25565/25566
#      to the Minecraft Services, but it was dead: the LoadBalancer Service only exposes 80/443,
#      the controller never listened on those ports, and the game Services don't expose them.
#      Players connect on the NodePorts (31115-31117). The old ConfigMap can be deleted by hand.
#   2. The extra LoadBalancer Service (`ingress-nginx-controller-loadbalancer`, the real
#      192.168.1.251 entrypoint) was hand-made and is not a chart object. It is kept verbatim in
#      static/manifests/ingress-nginx-loadbalancer.yaml.
controller:
  # Required by several Ingresses in this repo that use nginx.ingress.kubernetes.io/*-snippet.
  allowSnippetAnnotations: true

  service:
    # The chart Service stays NodePort, as it is live. External traffic arrives via the separate
    # LoadBalancer Service in static/manifests/, fronted by k3s klipper-lb.
    type: NodePort

  # The chart passes --publish-service so the controller can report an address in Ingress
  # status. Point it at the LoadBalancer Service that actually holds 192.168.1.251, which is now
  # Traefik's. Traefik reports the same Service, so the two controllers agree on Ingress status
  # while they run side by side.
  publishService:
    enabled: true
    pathOverride: traefik/traefik

  admissionWebhooks:
    enabled: true
