# traefik — chart https://traefik.github.io/charts. Chart 42.4.1 ships Traefik v3.7.19.
#
# Traefik replaces ingress-nginx, which is retired upstream and will never get a fix for the
# nginx HTTP/2 bugs CVE-2026-123007 / CVE-2026-123633.
#
# The Ingresses in this repo are NOT rewritten. Traefik's ingress-nginx provider serves
# `ingressClassName: nginx` Ingresses and honours their `nginx.ingress.kubernetes.io/*`
# annotations (every one used here is supported: ssl-redirect, whitelist-source-range,
# backend-protocol, proxy-body-size, proxy-*-timeout). That keeps nginx semantics — e.g. only
# Ingresses with a `tls:` block redirect to HTTPS, the body limit defaults to 1m — and lets
# ingress-nginx keep running next to Traefik as a fallback, since both read the same objects.
ingressClass:
  enabled: true
  # `nginx` stays the cluster default class for now.
  isDefaultClass: false

providers:
  kubernetesCRD:
    # New install with no IngressRoutes yet, so opt in to collision-safe naming from the start.
    safeNaming: true
  kubernetesIngressNGINX:
    enabled: true
    # Report this chart's LoadBalancer Service (192.168.1.251) as the Ingress address.
    # ingress-nginx is pointed at the same Service, so the two don't fight over Ingress status.
    publishService:
      enabled: true

service:
  spec:
    # This is the cluster entrypoint: k3s klipper-lb publishes it on the node, 192.168.1.251.
    # klipper-lb binds 80/443 as hostPorts, so only one LoadBalancer Service can hold them at a
    # time. To fall back to ingress-nginx, set this to NodePort and set the old Service in
    # static/manifests/ingress-nginx-loadbalancer.yaml back to LoadBalancer, then sync both.
    type: LoadBalancer
    # Preserve client source IPs. The whitelist-source-range allowlists depend on it.
    externalTrafficPolicy: Local

ports:
  # Traefik's entrypoint readTimeout covers the whole request including the body and defaults to
  # 60s, which would cut off long uploads (storyteller raises nginx's limits for exactly that).
  # nginx only times out between reads, so raise it well clear of any real upload.
  web:
    transport:
      respondingTimeouts:
        readTimeout: 1h
  websecure:
    transport:
      respondingTimeouts:
        readTimeout: 1h

accessLog:
  # Access logs show the client address Traefik sees, which is how to confirm the allowlists
  # are matching real client IPs rather than a NAT'd node address.
  enabled: true
