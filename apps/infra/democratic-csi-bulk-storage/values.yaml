# democratic-csi (bulk-storage) — chart https://democratic-csi.github.io/charts/, pinned to
# 0.15.1. Backs the "bulk-storage" StorageClass with NFS from TrueNAS at 192.168.1.250.
#
# The TrueNAS API key is NOT in this repo. The chart reads the whole driver config from the
# pre-existing in-cluster Secret below (the same name the chart would otherwise generate), so
# the live credential is reused untouched. `driver.config.driver` must still be set here —
# the chart uses it outside the secret to pick which templates to render.
csiDriver:
  name: nfs-bulk

driver:
  existingConfigSecret: bulk-storage-democratic-csi-driver-config
  config:
    driver: freenas-api-nfs

storageClasses:
  - name: bulk-storage
    defaultClass: false
    reclaimPolicy: Delete
    volumeBindingMode: Immediate
    allowVolumeExpansion: true
    parameters:
      fsType: nfs
      detachedVolumesFromSnapshots: "false"
    mountOptions:
      - noatime
      # NFSv4.1, not v3: v3 locking needs rpc.statd on the client, and unmounting after the
      # pods are killed blocks ~10 minutes on "lockd: cannot unmonitor", stalling host shutdown.
      # Only applies to newly provisioned PVs; existing PVs carry their own spec.mountOptions.
      - nfsvers=4.1
    secrets:
      provisioner-secret:
      controller-publish-secret:
      node-stage-secret:
      node-publish-secret:
      controller-expand-secret:
